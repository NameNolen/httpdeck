[package]
name = "httpdeck"
version = "0.1.0"
description = "IntelliJ HTTP Client compatible desktop client"
authors = ["HttpDeck"]
edition = "2021"

[lib]
name = "httpdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "gzip", "brotli", "deflate", "charset", "http2", "socks", "multipart"] }
rquickjs = "0.9"
uuid = { version = "1", features = ["v4"] }
cookie_store = { version = "0.22", features = ["serde_json"] }
chrono = "0.4"
base64 = "0.22"
url = "2"
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
