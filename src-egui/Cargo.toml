[package]
name = "httpdeck-egui"
version = "0.1.0"
description = "HttpDeck 原生 UI（egui）"
edition = "2021"

[[bin]]
name = "httpdeck-egui"
path = "src/main.rs"

[dependencies]
# 不启用 desktop 特性，避免为 egui 程序引入 tauri/webkit 依赖
httpdeck = { path = "../src-tauri", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
] }
egui = "0.37.0"
# Linux 使用 ksni（纯 DBus）后端，无需 GTK/libappindicator
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[build-dependencies]
embed-resource = "3"
