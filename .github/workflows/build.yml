name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build

      - name: Install npm dependencies
        run: npm ci

      # tauri-build 编译依赖库时会提前校验 bundle.resources；
      # 干净环境下先放占位文件，随后由真正的 MCP 构建产物覆盖。
      - name: Build MCP server
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          New-Item -ItemType File -Force target/release/httpdeck-mcp.exe | Out-Null
          cargo build --release -p httpdeck-mcp

      - name: Build egui binary
        if: ${{ hashFiles('src-egui/Cargo.toml') != '' }}
        run: cargo build --release -p httpdeck-egui

      # 在打包安装包之前先对内部 exe 签名，保证安装包内的可执行文件也带签名
      - name: Sign internal binaries
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: scripts/sign.ps1 -Files target/release/httpdeck-mcp.exe,target/release/httpdeck-egui.exe

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          Copy-Item $installer.FullName dist-artifacts/
          Copy-Item target/release/httpdeck-mcp.exe dist-artifacts/
          if (Test-Path target/release/httpdeck-egui.exe) {
            Copy-Item target/release/httpdeck-egui.exe dist-artifacts/
          }
          Get-ChildItem dist-artifacts | Format-Table Name, Length

      # 对最终产物（含安装包）签名；未配置证书时脚本会直接跳过。
      # 注意：不能在 if 条件里引用 secrets（GitHub 出于安全禁止），
      # 是否跳过由 sign.ps1 内部判断。
      - name: Sign final artifacts
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: scripts/sign.ps1 -Files (Get-ChildItem dist-artifacts -Filter *.exe | ForEach-Object FullName)

      - uses: actions/upload-artifact@v4
        with:
          name: httpdeck-windows-${{ github.sha }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  # Linux / macOS 只构建 egui 版（不依赖 webkit / tauri）
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-egui

      # egui 自带字体不含中文，CI 上装一份用于字体测试
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-core

      - name: Build egui binary
        run: cargo build --release -p httpdeck-egui

      - name: Test egui crate
        run: cargo test -p httpdeck-egui --bins

      # 按 Linux 目录规范打包，解压到 ~/.local 即可用（bin + 桌面入口 + 图标）
      - name: Package (portable prefix)
        run: |
          PREFIX=dist/HttpDeck
          mkdir -p "$PREFIX/bin" "$PREFIX/share/applications" \
                   "$PREFIX/share/icons/hicolor/512x512/apps"
          cp target/release/httpdeck-egui "$PREFIX/bin/"
          cp src-tauri/icons/icon.png "$PREFIX/share/icons/hicolor/512x512/apps/httpdeck.png"
          cat > "$PREFIX/share/applications/httpdeck.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HttpDeck
          Comment=HTTP client for .http files
          Exec=httpdeck-egui
          Icon=httpdeck
          Terminal=false
          Categories=Development;
          EOF
          tar -C dist -czf httpdeck-linux-x86_64.tar.gz HttpDeck

      - uses: actions/upload-artifact@v4
        with:
          name: httpdeck-linux-${{ github.sha }}
          path: httpdeck-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-egui

      - name: Build egui binary
        run: cargo build --release -p httpdeck-egui

      - name: Test egui crate
        run: cargo test -p httpdeck-egui --bins

      # 组装 .app（图标复用 tauri 的 icon.icns），再 zip 成可直接分发的产物
      - name: Package app bundle
        run: |
          VERSION=$(grep -m1 '^version' src-egui/Cargo.toml | cut -d'"' -f2)
          APP=dist/HttpDeck.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/httpdeck-egui "$APP/Contents/MacOS/httpdeck-egui"
          cp src-tauri/icons/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>HttpDeck</string>
            <key>CFBundleDisplayName</key><string>HttpDeck</string>
            <key>CFBundleIdentifier</key><string>com.httpdeck.egui</string>
            <key>CFBundleExecutable</key><string>httpdeck-egui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "$APP" httpdeck-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: httpdeck-macos-${{ github.sha }}
          path: httpdeck-macos.zip
          if-no-files-found: error
          retention-days: 30
