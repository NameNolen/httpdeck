name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build

      - name: Install npm dependencies
        run: npm ci

      # tauri-build 编译依赖库时会提前校验 bundle.resources；
      # 干净环境下先放占位文件，随后由真正的 MCP 构建产物覆盖。
      - name: Build MCP server
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          New-Item -ItemType File -Force target/release/httpdeck-mcp.exe | Out-Null
          cargo build --release -p httpdeck-mcp

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build

      - name: Build egui binary
        if: ${{ hashFiles('src-egui/Cargo.toml') != '' }}
        run: cargo build --release -p httpdeck-egui

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if (-not $installer) { throw "未找到 NSIS 安装包" }
          Copy-Item $installer.FullName dist-artifacts/
          Copy-Item target/release/httpdeck-mcp.exe dist-artifacts/
          if (Test-Path target/release/httpdeck-egui.exe) {
            Copy-Item target/release/httpdeck-egui.exe dist-artifacts/
          }
          Get-ChildItem dist-artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: httpdeck-windows-${{ github.sha }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30
